[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dictz"
version = "0.1.5"
description = "dictz — a cross-platform multi-format offline dictionary application (GoldenDict-style)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Bayram Kotan", email = "bayramkotan@gmail.com" }]
maintainers = [{ name = "Bayram Kotan", email = "bayramkotan@gmail.com" }]
keywords = [
    "dictionary", "stardict", "dsl", "babylon", "goldendict",
    "offline", "lexicography", "translation", "pyside6", "qt",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Environment :: Win32 (MS Windows)",
    "Environment :: MacOS X",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Education",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Natural Language :: English",
    "Natural Language :: Turkish",
    "Operating System :: OS Independent",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Education",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "PySide6>=6.6.0",
    "PySide6-Addons>=6.6.0",
    "rapidfuzz>=3.6.0",
    "pyglossary>=4.7.0,<5.0.0",
    "python-xlib>=0.33; sys_platform == 'linux'",
]

[project.optional-dependencies]
tts = ["edge-tts>=6.1.0", "pyttsx3>=2.90"]
ocr = ["mss>=9.0.0", "pytesseract>=0.3.10", "Pillow>=10.0.0"]
anki = ["requests>=2.31.0"]
hotkeys = ["pynput>=1.7.6; sys_platform == 'darwin'"]
all = ["dictz[tts,ocr,anki,hotkeys]"]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.3.0",
    "pyinstaller>=6.0.0",
]

[project.scripts]
dictz = "dictz.app:main"
dct = "dictz.app:main"

[project.urls]
Homepage = "https://github.com/bayramkotan/dictz"
Repository = "https://github.com/bayramkotan/dictz"
Issues = "https://github.com/bayramkotan/dictz/issues"
Documentation = "https://github.com/bayramkotan/dictz#readme"
Changelog = "https://github.com/bayramkotan/dictz/blob/main/CHANGELOG.md"
Releases = "https://github.com/bayramkotan/dictz/releases"

[tool.setuptools.packages.find]
where = ["."]
include = ["dictz*"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["build", "dist", ".venv", "venv", "packaging/pyinstaller/dictz.spec"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
# E501 line-too-long, N806/N802 Qt naming (QObjects use camelCase), B008 Qt signals, UP007 Union syntax (keep X | None readable in older runtimes)
ignore = ["E501", "N802", "N803", "N806", "B008", "UP007", "UP035", "UP045"]
per-file-ignores = { "tests/*" = ["E402"] }

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning:pyglossary.*",
]

[tool.coverage.run]
source = ["dictz"]
omit = ["dictz/__main__.py", "dictz/ui/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
show_missing = true
