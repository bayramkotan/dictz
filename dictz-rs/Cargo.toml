[package]
name = "dictz"
version = "0.2.1"
edition = "2021"
rust-version = "1.89"
authors = ["Bayram Kotan"]
description = "dictz — cross-platform, multi-format offline dictionary (StarDict, DSL, Babylon) with a desktop GUI. Rust edition of github.com/bayramkotan/dictz"
repository = "https://github.com/bayramkotan/dictz"
homepage = "https://github.com/bayramkotan/dictz"
license = "GPL-3.0-or-later"
readme = "README.md"
# private since v0.2.1: never uploaded to crates.io (CI only runs cargo package)
publish = false
keywords = ["dictionary", "stardict", "dsl", "babylon", "offline"]
categories = ["text-processing", "gui", "command-line-utilities"]
include = [
    "src/**/*.rs",
    "src/completion/*.txt",
    "src/i18n/catalog.json",
    "src/center/languages.json",
    "src/gui/themes.json",
    "src/flags/*.png",
    "src/uiicons/*.png",
    "src/flags/LICENSE-flag-icons.txt",
    "Cargo.toml",
    "Cargo.lock",
    "README.md",
]

[lib]
name = "dictz"
path = "src/lib.rs"

[[bin]]
name = "dictz"
path = "src/main.rs"
required-features = ["cli"]

# short name, like `vs` for venvstudio: the same program
[[bin]]
name = "dct"
path = "src/bin/dct.rs"
required-features = ["cli"]

[features]
# `cli` = the `dictz` binary's command line, `gui` = the desktop window,
# `audio` = in-app playback of DSL sounds (needs ALSA headers on Linux:
# libasound2-dev / alsa-lib), `update` = `dictz update` (HTTPS download),
# `center` = the Dictionary Center (catalogs, downloads, import / export),
# `scan` = scan popup (clipboard / selection), global hotkeys and tray icon.
# Library-only users: `dictz = { version = "...", default-features = false }`.
default = ["cli", "gui", "audio", "update", "scan", "center"]
cli = ["dep:clap", "center"]
gui = ["dep:eframe", "dep:egui_extras", "dep:rfd", "dep:image", "dep:raw-window-handle", "dep:ar-reshaper",
       "dep:unicode-bidi", "center"]
audio = ["dep:rodio"]
update = ["dep:ureq", "dep:tar"]
# the Dictionary Center: sources, catalogs, downloads, install, import / export
center = ["dep:ureq", "dep:tar", "dep:regex", "dep:sha2", "dep:md-5", "dep:lzma-rs", "dep:bzip2"]
scan = ["gui", "dep:arboard", "dep:clipboard-master", "dep:global-hotkey", "dep:mouse_position",
        "dep:tray-icon", "dep:ksni", "dep:x11rb"]

[dependencies]
flate2 = "1"
encoding_rs = "0.8"
zip = { version = "2", default-features = false, features = ["deflate"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
clap = { version = "4.5", optional = true, features = ["derive", "wrap_help"] }
ureq = { version = "2.12", optional = true, default-features = false, features = ["tls", "gzip", "proxy-from-env"] }
tar = { version = "0.4", optional = true, default-features = false }
# Dictionary Center: patterns, checksums, .tar.xz / .tar.bz2 (pure Rust)
regex = { version = "1", optional = true, default-features = false, features = ["std", "unicode", "perf"] }
sha2 = { version = "0.10", optional = true }
md-5 = { version = "0.10", optional = true }
lzma-rs = { version = "0.3", optional = true }
bzip2 = { version = "0.6", optional = true }

eframe = { version = "0.31", optional = true, default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "persistence"] }
egui_extras = { version = "0.31", optional = true, default-features = false, features = ["image"] }
image = { version = "0.25", optional = true, default-features = false, features = ["png", "jpeg", "gif", "bmp", "tiff", "ico"] }
rfd = { version = "0.15", optional = true }
rodio = { version = "0.20", optional = true, default-features = false, features = ["wav", "mp3", "vorbis", "flac"] }
arboard = { version = "3.4", optional = true, default-features = false, features = ["wayland-data-control"] }
clipboard-master = { version = "4", optional = true }
global-hotkey = { version = "0.7", optional = true }
mouse_position = { version = "0.1.4", optional = true }
raw-window-handle = { version = "0.6", optional = true }
# right-to-left interface languages (Arabic, Persian, Urdu): egui does not shape text itself
ar-reshaper = { version = "1.5", optional = true }
unicode-bidi = { version = "0.3", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Console", "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Globalization"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
tray-icon = { version = "0.21", optional = true, default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", optional = true, default-features = false, features = ["blocking", "async-io"] }
x11rb = { version = "0.13", optional = true, features = ["xfixes"] }

[dev-dependencies]


[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
