name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel earlier runs of the same branch when a new push lands
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  # ---------------------------------------------------------------------
  # 1) Lint — fast feedback, blocks everything else
  # ---------------------------------------------------------------------
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install ruff
        run: pip install "ruff>=0.3.0"

      - name: Lint (ruff check)
        run: ruff check .

      - name: Formatting check (ruff format)
        run: ruff format --check . || echo "::warning::code is not ruff-formatted (non-blocking)"
        continue-on-error: true

  # ---------------------------------------------------------------------
  # 2) Test matrix — 3 OS families × 4 Python versions
  # ---------------------------------------------------------------------
  test:
    name: Test · ${{ matrix.os }} · py${{ matrix.python-version }}
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-24.04
          - windows-2022
          - windows-latest
          - macos-13       # Intel
          - macos-14       # Apple Silicon
          - macos-latest
        python-version: ['3.10', '3.11', '3.12', '3.13']
        exclude:
          # Trim the matrix: keep each OS covered end-to-end but don't test every
          # Python on every image. Ubuntu 22.04 and windows-2022 carry the full
          # matrix; the others sample one or two Pythons.
          - { os: ubuntu-24.04, python-version: '3.10' }
          - { os: ubuntu-24.04, python-version: '3.11' }
          - { os: windows-latest, python-version: '3.10' }
          - { os: windows-latest, python-version: '3.11' }
          - { os: macos-13, python-version: '3.10' }
          - { os: macos-13, python-version: '3.11' }
          - { os: macos-14, python-version: '3.10' }
          - { os: macos-14, python-version: '3.11' }
          - { os: macos-latest, python-version: '3.10' }
          - { os: macos-latest, python-version: '3.11' }
          - { os: macos-latest, python-version: '3.12' }

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Linux Qt + Xcb runtime libs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libegl1 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 \
            libxcb-cursor0 libdbus-1-3 libgl1 libfontconfig1

      - name: Install project + dev deps + PyYAML + coverage
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install pyyaml pytest-cov

      - name: Diagnostic — what's installed
        shell: bash
        run: pip list

      - name: Run pytest
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          QTWEBENGINE_DISABLE_SANDBOX: "1"
          QTWEBENGINE_CHROMIUM_FLAGS: "--no-sandbox --disable-gpu"
        run: |
          pytest -v \
            --cov=dictz --cov-report=term --cov-report=xml \
            --junit-xml=junit-${{ matrix.os }}-py${{ matrix.python-version }}.xml

      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.os }}-py${{ matrix.python-version }}
          path: junit-*.xml
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload coverage (one combo only)
        if: matrix.os == 'ubuntu-22.04' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 14

  # ---------------------------------------------------------------------
  # 3) Minimum-version sanity check: install from PyPI constraints like a
  #    downstream user would, no editable install, no dev extras.
  # ---------------------------------------------------------------------
  install-smoke:
    name: Install smoke · py${{ matrix.python-version }}
    needs: test
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Linux Qt deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libegl1 libxkbcommon0 libxcb-xinerama0 libxcb-cursor0 libgl1 libfontconfig1
      - name: Install from wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
          pip install dist/*.whl
      - name: Smoke-import the package
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -c "import dictz; print('dictz version:', dictz.__version__)"
          python -c "from dictz.core.query_manager import supported_extensions; print(supported_extensions())"
          python -c "from dictz.parsers.stardict import StarDictDictionary; print(StarDictDictionary)"

  # ---------------------------------------------------------------------
  # 4) Summary — one green/red dot for the whole workflow
  # ---------------------------------------------------------------------
  all-green:
    name: All checks passed
    if: always()
    needs: [lint, test, install-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any dependency failed
        run: |
          if [ "${{ needs.lint.result }}" != "success" ]; then
            echo "lint failed"; exit 1
          fi
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "test failed"; exit 1
          fi
          if [ "${{ needs.install-smoke.result }}" != "success" ]; then
            echo "install-smoke failed"; exit 1
          fi
          echo "All green."
