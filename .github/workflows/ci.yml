name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

permissions:
  contents: write     # GitHub Releases
  id-token: write     # PyPI Trusted Publishing (OIDC)

env:
  FORCE_COLOR: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}

jobs:
  # =====================================================================
  # 1) Lint — fast feedback, blocks everything else
  # =====================================================================
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install "ruff>=0.3.0"
      - run: ruff check .
      - run: ruff format --check . || echo "::warning::code is not ruff-formatted (non-blocking)"
        continue-on-error: true

  # =====================================================================
  # 2) Python test matrix — every push + PR
  # =====================================================================
  test:
    name: Test · ${{ matrix.os }} · py${{ matrix.python-version }}
    needs: lint
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, windows-2022, windows-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']
        exclude:
          - { os: ubuntu-24.04, python-version: '3.10' }
          - { os: ubuntu-24.04, python-version: '3.11' }
          - { os: windows-latest, python-version: '3.10' }
          - { os: windows-latest, python-version: '3.11' }
          - { os: macos-latest, python-version: '3.10' }
          - { os: macos-latest, python-version: '3.11' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Linux Qt system libs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libegl1 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 \
            libxcb-cursor0 libdbus-1-3 libgl1 libfontconfig1
      - name: Install project + dev deps + PyYAML + coverage
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install pyyaml pytest-cov
      - name: Run pytest
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          QTWEBENGINE_DISABLE_SANDBOX: "1"
          QTWEBENGINE_CHROMIUM_FLAGS: "--no-sandbox --disable-gpu"
        run: pytest -v --cov=dictz --cov-report=term --cov-report=xml

  # =====================================================================
  # 3) Rust check + test — every push + PR
  # =====================================================================
  rust:
    name: Rust · ${{ matrix.os }}
    needs: lint
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: dictz-rs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            dictz-rs/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('dictz-rs/Cargo.toml') }}
      - run: cargo check --all-targets
      - run: cargo test --all-targets
      - name: Release build (tag only)
        if: env.IS_TAG == 'true'
        run: cargo build --release

  # =====================================================================
  # 4) Install smoke — wheel build + import test
  # =====================================================================
  install-smoke:
    name: Install smoke · py${{ matrix.python-version }}
    needs: test
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Linux Qt deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libegl1 libxkbcommon0 libxcb-xinerama0 libxcb-cursor0 libgl1 libfontconfig1
      - name: Build + install wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
          pip install dist/*.whl
      - name: Smoke-import
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -c "import dictz; print('dictz version:', dictz.__version__)"
          python -c "from dictz.core.query_manager import supported_extensions; print(supported_extensions())"

  # =====================================================================
  # 5) Build Python portable binaries — tag only
  # =====================================================================
  build-python-binaries:
    name: Py binary · ${{ matrix.artifact }}
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, rust]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04,  artifact: dictz-linux-x86_64 }
          - { os: windows-latest, artifact: dictz-windows-x86_64 }
          - { os: macos-13,       artifact: dictz-macos-x86_64 }
          - { os: macos-latest,   artifact: dictz-macos-arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project + PyInstaller
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pyinstaller
      - name: Linux Qt deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libegl1 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 \
            libxcb-cursor0 libdbus-1-3 libnss3 libxcomposite1 libxdamage1 \
            libxrandr2 libxtst6 libgl1 libfontconfig1
      - name: PyInstaller
        shell: bash
        run: pyinstaller packaging/pyinstaller/dictz.spec --noconfirm --clean
      - name: Package Linux tarball + AppImage
        if: runner.os == 'Linux'
        run: |
          cd dist && tar czf ../${{ matrix.artifact }}.tar.gz dictz/ && cd ..
          bash packaging/appimage/build_appimage.sh || true
          mv dist/dictz-*.AppImage dictz-linux-x86_64.AppImage 2>/dev/null || true
      - name: Package Windows zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/dictz -DestinationPath ${{ matrix.artifact }}.zip -Force
      - name: Package macOS zip
        if: runner.os == 'macOS'
        run: cd dist && zip -qr ../${{ matrix.artifact }}.zip dictz.app/
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.zip
            *.AppImage
          if-no-files-found: ignore
          retention-days: 7

  # =====================================================================
  # 6) Build Python wheel + sdist — tag only
  # =====================================================================
  build-python-dist:
    name: Build sdist + wheel
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install --upgrade build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*
          retention-days: 7

  # =====================================================================
  # 7) Publish to PyPI via Trusted Publishing — tag only
  # =====================================================================
  publish-pypi:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-python-dist
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/dictz/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
          print-hash: true

  # =====================================================================
  # 8) Publish to crates.io — tag only, token-gated
  # =====================================================================
  publish-crates:
    name: Publish to crates.io
    if: startsWith(github.ref, 'refs/tags/v')
    needs: rust
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: crates-io
      url: https://crates.io/crates/dictz
    defaults:
      run:
        working-directory: dictz-rs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo publish --dry-run --allow-dirty
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::warning::CARGO_REGISTRY_TOKEN secret not set — skipping crates.io publish. See docs/PACKAGING.md."
            exit 0
          fi
          cargo publish --allow-dirty

  # =====================================================================
  # 9) GitHub Release — tag only, after everything
  # =====================================================================
  github-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-python-binaries, build-python-dist, rust]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Flatten
        run: |
          mkdir -p release
          find artifacts -type f \
            \( -name "*.tar.gz" -o -name "*.zip" -o -name "*.AppImage" \
               -o -name "*.whl" \) \
            -exec cp -v {} release/ \;
          ls -lh release/
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
          body: |
            ## Install
            - **PyPI**: `pip install dictz==${{ github.ref_name }}` (strip the `v`)
            - **crates.io** (Rust): `cargo add dictz@${{ github.ref_name }}` (strip the `v`)
            - **Portable binaries**: pick the matching archive below

            See [CHANGELOG.md](https://github.com/bayramkotan/dictz/blob/main/CHANGELOG.md) for details.
