name: CI

# One workflow, one run per release.
#   push a v* tag   -> lint + test + rust + install-smoke, then a GitHub
#                      Release with the portable binaries of BOTH editions,
#                      the Python wheel and the Android APK
#
# Since v0.2.1 the repository is private and dictz is not published to PyPI or
# crates.io any more: a tag must never upload the source anywhere public. The
# Python wheel and the Rust crate are only built (and checked) here.
#   pull request    -> lint + test + rust + install-smoke
#   manual          -> Actions -> CI -> "Run workflow" (tests only, plus the
#                      phone apps: their APK / unsigned iOS app as artifacts)
#
# The mobile jobs (dictz-mobile/: Flutter + the Rust core) run on tags and
# manual runs, not on pull requests. They do not hold up the release: on a
# tag the Android APK is one of the release's files (the release does not
# wait for it to succeed).
#
# Plain pushes to main deliberately do NOT trigger CI: a release pushes both
# main and a tag, which GitHub reports as two separate push events — reacting
# to both produced two runs for every release.
#
# No repository secrets are needed (the release uses the built-in GITHUB_TOKEN).

# The Actions list shows each run under the tagged commit's TITLE (its first
# line only), so the list reads version by version: "v0.0.9: <short title>".
# There is deliberately no run-name: GitHub expressions cannot cut the commit
# message at its first line, and a run-name built from head_commit.message
# showed the whole commit body as the run title (v0.0.9, cancelled).
# The preflight below fails a tag whose commit title does not start with
# "vX.Y.Z: " or is longer than 72 characters.

on:
  push:
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch/tag cancels the older run, so a re-pushed
# tag never queues behind a stale run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  FORCE_COLOR: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  # ===================================================================
  # 0) Release preflight — tag only. Fails fast if secrets are missing
  #    or the tag does not match the version in the source files.
  # ===================================================================
  preflight:
    name: Release preflight
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches source versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          py=$(sed -nE 's/^version = "([^"]+)"/\1/p' pyproject.toml | head -n1)
          init=$(sed -nE 's/^__version__ = "([^"]+)"/\1/p' dictz/__init__.py)
          rs=$(sed -nE 's/^version = "([^"]+)"/\1/p' dictz-rs/Cargo.toml | head -n1)
          echo "tag=$tag pyproject=$py __init__=$init Cargo=$rs"
          if [ "$tag" != "$py" ] || [ "$tag" != "$init" ] || [ "$tag" != "$rs" ]; then
            echo "::error::Tag v$tag does not match pyproject ($py), dictz/__init__.py ($init) and dictz-rs/Cargo.toml ($rs)."
            exit 1
          fi
      - name: Check the tagged commit is the release commit
        run: |
          title=$(git log -1 --format=%s)
          echo "commit title: $title"
          case "$title" in
            "${GITHUB_REF_NAME}: "*) ;;
            *) echo "::error::The tag ${GITHUB_REF_NAME} is on a commit whose title does not start with '${GITHUB_REF_NAME}: ' — it was put on the wrong commit. Delete it (git tag -d ${GITHUB_REF_NAME}; git push origin :refs/tags/${GITHUB_REF_NAME}), commit the release as '${GITHUB_REF_NAME}: ...' and tag again."
               exit 1 ;;
          esac
          if [ ${#title} -gt 72 ]; then
            echo "::error::The commit title is ${#title} characters; the Actions list shows it as the run title, so keep it short (at most 72): '${GITHUB_REF_NAME}: <a few words>'. Put the details in the next -m paragraphs."
            exit 1
          fi

  # ===================================================================
  # 1) Lint
  # ===================================================================
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install "ruff>=0.3.0"
      - run: ruff check .

  # ===================================================================
  # 2) Python test matrix
  # ===================================================================
  test:
    name: Test · ${{ matrix.os }} · py${{ matrix.python-version }}
    needs: lint
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, windows-2022, windows-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
        exclude:
          - { os: ubuntu-22.04, python-version: '3.14' }
          - { os: windows-2022, python-version: '3.14' }
          - { os: ubuntu-24.04, python-version: '3.10' }
          - { os: ubuntu-24.04, python-version: '3.11' }
          - { os: windows-latest, python-version: '3.10' }
          - { os: windows-latest, python-version: '3.11' }
          - { os: macos-latest, python-version: '3.10' }
          - { os: macos-latest, python-version: '3.11' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Linux Qt system libs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libegl1 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 \
            libxcb-cursor0 libdbus-1-3 libgl1 libfontconfig1
      - name: Install project + dev deps
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install pyyaml pytest-cov
      - name: Run pytest
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          QTWEBENGINE_DISABLE_SANDBOX: "1"
          QTWEBENGINE_CHROMIUM_FLAGS: "--no-sandbox --disable-gpu"
        run: pytest -v --cov=dictz --cov-report=term

  # ===================================================================
  # 3) Rust check + test
  # ===================================================================
  rust:
    name: Rust · ${{ matrix.os }}
    needs: lint
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: dictz-rs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux audio headers (rodio / ALSA)
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            dictz-rs/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('dictz-rs/Cargo.lock') }}
      - run: cargo check --locked --all-targets
      # parity tests compare with tests/data/parity/*_golden.json (Python edition output)
      - run: cargo test --locked --all-targets
      - name: Library-only build (no GUI / audio dependencies)
        run: cargo test --locked --no-default-features --lib
      - name: Selftest (debug binary)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            # GUI-subsystem exe: no console output, read the report file
            rc=0
            DICTZ_SELFTEST_REPORT="$PWD/selftest.txt" ./target/debug/dictz.exe --selftest || rc=$?
            cat selftest.txt || true
            exit $rc
          fi
          ./target/debug/dictz --selftest

  # ===================================================================
  # 4) Install smoke — wheel build + import
  # ===================================================================
  install-smoke:
    name: Install smoke · py${{ matrix.python-version }}
    needs: test
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Linux Qt deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libegl1 libxkbcommon0 libxcb-xinerama0 libxcb-cursor0 libgl1 libfontconfig1
      - name: Build + install wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
          pip install dist/*.whl
      - name: Console script + selftest (as a pip user would run it)
        run: |
          command -v dictz
          dictz --version
          dct -V
          dct --Version
          dictz --selftest

  # ===================================================================
  # 5) Python package (sdist + wheel) — tag only, built and checked, NOT
  #    uploaded to PyPI (private since v0.2.1); the wheel goes into the
  #    GitHub Release
  # ===================================================================
  python-dist:
    name: Python package
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [preflight, test, install-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*
          retention-days: 7

  # ===================================================================
  # 6) Rust crate — tag only, packaged and checked (cargo package), NOT
  #    uploaded to crates.io (private since v0.2.1)
  # ===================================================================
  rust-package:
    name: Rust crate
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [preflight, rust]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dictz-rs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux audio headers (cargo package builds the crate)
        working-directory: .
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config
      - name: Package (no upload)
        run: cargo package --locked --allow-dirty

  # ===================================================================
  # 7) Portable binaries — tag only
  #    No Intel macOS runner: GitHub's Intel macOS pool starves public
  #    repos (jobs never start) and would block the whole release.
  # ===================================================================
  build-binaries:
    name: Binary · ${{ matrix.artifact }}
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [preflight, test]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04,   artifact: dictz-linux-x86_64 }
          - { os: windows-latest, artifact: dictz-windows-x86_64 }
          - { os: macos-latest,   artifact: dictz-macos-arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Linux Qt deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libegl1 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 \
            libxcb-cursor0 libdbus-1-3 libnss3 libxcomposite1 libxdamage1 \
            libxrandr2 libxtst6 libgl1 libfontconfig1 libfuse2
      - name: Install project + PyInstaller
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pyinstaller
      - name: PyInstaller
        shell: bash
        run: pyinstaller packaging/pyinstaller/dictz.spec --noconfirm --clean

      # --- Prove the frozen binary actually works before shipping it ------
      - name: Selftest frozen binary (Linux)
        if: runner.os == 'Linux'
        run: ./dist/dictz/dictz --selftest
      - name: Selftest frozen binary (macOS)
        if: runner.os == 'macOS'
        run: ./dist/dictz.app/Contents/MacOS/dictz --selftest
      - name: Selftest frozen binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # dictz.exe is a GUI-subsystem binary: no console, so wait for it
          # explicitly and read the report it writes to a file.
          $env:DICTZ_SELFTEST_REPORT = "$PWD\selftest.txt"
          $p = Start-Process -FilePath "dist\dictz\dictz.exe" -ArgumentList "--selftest" -Wait -PassThru -NoNewWindow
          if (Test-Path selftest.txt) { Get-Content selftest.txt }
          if ($p.ExitCode -ne 0) { throw "selftest failed with exit code $($p.ExitCode)" }

      - name: Package Linux (tar.gz + AppImage)
        if: runner.os == 'Linux'
        run: |
          ln -sf dictz dist/dictz/dct   # short name
          ./dist/dictz/dct -V
          tar -C dist -czf ${{ matrix.artifact }}.tar.gz dictz
          bash packaging/appimage/build_appimage.sh "${GITHUB_REF_NAME#v}"
          cp dist/*.AppImage ${{ matrix.artifact }}.AppImage
          APPIMAGE_EXTRACT_AND_RUN=1 ./${{ matrix.artifact }}.AppImage --selftest
      - name: Package Windows (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item dist\dictz\dictz.exe dist\dictz\dct.exe -Force   # short name
          Compress-Archive -Path dist/dictz -DestinationPath ${{ matrix.artifact }}.zip -Force
      - name: Package macOS (zip)
        if: runner.os == 'macOS'
        run: cd dist && zip -qry ../${{ matrix.artifact }}.zip dictz.app
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.zip
            ${{ matrix.artifact }}.AppImage
          if-no-files-found: error
          retention-days: 7

  # ===================================================================
  # 7b) Portable binaries of the Rust edition — tag only
  # ===================================================================
  build-rust-binaries:
    name: Rust binary · ${{ matrix.artifact }}
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [preflight, rust]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04,   artifact: dictz-rs-linux-x86_64 }
          - { os: windows-latest, artifact: dictz-rs-windows-x86_64 }
          - { os: macos-latest,   artifact: dictz-rs-macos-arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux audio headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config
      - name: cargo build --release
        working-directory: dictz-rs
        run: cargo build --release --locked
      - name: Selftest release binary (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          ./dictz-rs/target/release/dictz --selftest
          ./dictz-rs/target/release/dct -V
      - name: Selftest release binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:DICTZ_SELFTEST_REPORT = "$PWD\selftest-rs.txt"
          $p = Start-Process -FilePath "dictz-rs\target\release\dictz.exe" -ArgumentList "--selftest" -Wait -PassThru -NoNewWindow
          if (Test-Path selftest-rs.txt) { Get-Content selftest-rs.txt }
          if ($p.ExitCode -ne 0) { throw "selftest failed with exit code $($p.ExitCode)" }
      - name: Package (tar.gz)
        if: runner.os != 'Windows'
        run: |
          mkdir -p pkg/dictz-rs
          cp dictz-rs/target/release/dictz pkg/dictz-rs/
          ln -sf dictz pkg/dictz-rs/dct   # short name
          cp LICENSE dictz-rs/README.md pkg/dictz-rs/
          tar -C pkg -czf ${{ matrix.artifact }}.tar.gz dictz-rs
      - name: Package (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force pkg\dictz-rs | Out-Null
          Copy-Item dictz-rs\target\release\dictz.exe, dictz-rs\target\release\dct.exe, LICENSE, dictz-rs\README.md pkg\dictz-rs\ -Force
          Compress-Archive -Path pkg\dictz-rs -DestinationPath ${{ matrix.artifact }}.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.zip
          if-no-files-found: error
          retention-days: 7

  # ===================================================================
  # 8) GitHub Release — tag only. Publishes whatever was built, even if
  #    one platform's binary failed, so a single broken runner never
  #    blocks the release.
  # ===================================================================
  github-release:
    name: Publish GitHub Release
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') && needs.python-dist.result == 'success' && needs.rust-package.result == 'success' }}
    # mobile-android: its APK goes into the release too; when it fails the
    # release still goes out (the condition above does not ask for it)
    needs: [python-dist, rust-package, build-binaries, build-rust-binaries, mobile-android]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect files
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" -o -name "*.AppImage" -o -name "*.whl" -o -name "*.apk" \) \
            ! -name "*ios-unsigned*" -exec cp -v {} release/ \;
          ls -lh release/
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: false
          body: |
            dictz ships as two editions with the same features: **Python** (Qt) and **Rust** (egui).

            ## Python edition
            - **Wheel:** `pipx install ./dictz-<version>-py3-none-any.whl` (or `pip install`)
            - **Portable:**
              - Linux: `dictz-linux-x86_64.AppImage` (`chmod +x` then run) or `.tar.gz`
              - Windows: `dictz-windows-x86_64.zip` → run `dictz.exe`
              - macOS (Apple Silicon): `dictz-macos-arm64.zip` → right-click `dictz.app` → Open

            ## Android
            - `dictz-<version>-android.apk` → open it on the phone to install (allow "install unknown apps" for the browser / file manager once). iOS needs an Apple developer account and comes later.

            ## Rust edition
            - **Portable (single binary):**
              - Linux: `dictz-rs-linux-x86_64.tar.gz` → `dictz-rs/dictz`
              - Windows: `dictz-rs-windows-x86_64.zip` → `dictz-rs\dictz.exe`
              - macOS (Apple Silicon): `dictz-rs-macos-arm64.tar.gz` → `dictz-rs/dictz`

            Both editions install the short name **`dct`** too (`dct -V`, `dct update`, `dct shortcut`).
            Both editions share the dictionary list, history and favorites (same data folder).

            Since v0.2.1 dictz is no longer published to PyPI or crates.io. See CHANGELOG.md.

  # ------------------------------------------------------------ phone apps
  mobile-core:
    name: Mobile · Rust core
    timeout-minutes: 60
    needs: lint
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: fmt, clippy, test
        working-directory: dictz-mobile/rust
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

  mobile-android:
    name: Mobile · Android (APK)
    timeout-minutes: 60
    needs: mobile-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true
      - name: Prepare (assets, platform folders, Rust core for Android)
        working-directory: dictz-mobile
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
        run: tool/prepare.sh android
      - name: Test, screenshots and build
        working-directory: dictz-mobile
        run: |
          sudo apt-get install -y fonts-dejavu-core >/dev/null
          flutter pub get
          flutter test
          # the screens at a phone's size with made-up articles → test_screens/screenshots/*.png
          flutter test test_screens --update-goldens
          flutter build apk --release
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          cp build/app/outputs/flutter-apk/app-release.apk "dictz-${VERSION}-android.apk"
          ls -la dictz-*-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: dictz-android
          path: dictz-mobile/dictz-*-android.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dictz-mobile-screenshots
          path: dictz-mobile/test_screens/screenshots/*.png

  mobile-ios:
    name: Mobile · iOS (unsigned)
    timeout-minutes: 60
    needs: mobile-core
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true
      - name: Prepare (assets, platform folders, Rust core for iOS)
        working-directory: dictz-mobile
        run: tool/prepare.sh ios
      - name: Build
        working-directory: dictz-mobile
        run: |
          flutter pub get
          flutter build ios --release --no-codesign
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          (cd build/ios/iphoneos && zip -qr "../../../dictz-${VERSION}-ios-unsigned.zip" Runner.app)
          ls -la dictz-*-ios-unsigned.zip
      - uses: actions/upload-artifact@v4
        with:
          name: dictz-ios-unsigned
          path: dictz-mobile/dictz-*-ios-unsigned.zip
