name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write    # GitHub Releases
  id-token: write    # PyPI Trusted Publishing (OIDC)

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_COLOR: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  # =====================================================================
  # 1) Python portable binaries — PyInstaller on 4 OS runners
  # =====================================================================
  build-python-binaries:
    name: Py binary · ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact: dictz-linux-x86_64
          - os: windows-latest
            artifact: dictz-windows-x86_64
          - os: macos-13
            artifact: dictz-macos-x86_64
          - os: macos-latest
            artifact: dictz-macos-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install project + PyInstaller
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pyinstaller

      - name: Install Linux Qt system libs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libegl1 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 \
            libxcb-cursor0 libdbus-1-3 libnss3 libxcomposite1 libxdamage1 \
            libxrandr2 libxtst6 libgl1 libfontconfig1

      - name: Run PyInstaller
        shell: bash
        run: pyinstaller packaging/pyinstaller/dictz.spec --noconfirm --clean

      - name: Package Linux tarball
        if: runner.os == 'Linux'
        run: |
          cd dist && tar czf ../${{ matrix.artifact }}.tar.gz dictz/

      - name: Build AppImage
        if: runner.os == 'Linux'
        run: |
          bash packaging/appimage/build_appimage.sh || true
          mv dist/dictz-*.AppImage dictz-linux-x86_64.AppImage 2>/dev/null || true

      - name: Package Windows zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/dictz -DestinationPath ${{ matrix.artifact }}.zip -Force

      - name: Package macOS zip
        if: runner.os == 'macOS'
        run: |
          cd dist && zip -qr ../${{ matrix.artifact }}.zip dictz.app/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.zip
            *.AppImage
          if-no-files-found: ignore
          retention-days: 7

  # =====================================================================
  # 2) Build the Python wheel + sdist for PyPI
  # =====================================================================
  build-python-dist:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install build
        run: pip install --upgrade build
      - name: Build
        run: python -m build
      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*
          retention-days: 7

  # =====================================================================
  # 3) Publish to PyPI via Trusted Publishing (OIDC, no secrets)
  #    One-time setup: https://pypi.org/manage/account/publishing/
  # =====================================================================
  publish-pypi:
    name: Publish to PyPI
    needs: build-python-dist
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/dictz/
    permissions:
      id-token: write
    steps:
      - name: Download wheel + sdist
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
          print-hash: true

  # =====================================================================
  # 4) Rust crate — build, test, publish to crates.io
  # =====================================================================
  build-rust:
    name: Rust · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: dictz-rs
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            dictz-rs/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('dictz-rs/Cargo.toml') }}
      - name: Check
        run: cargo check --all-targets
      - name: Test
        run: cargo test --all-targets
      - name: Build release
        run: cargo build --release

  publish-crates:
    name: Publish to crates.io
    needs: build-rust
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: crates-io
      url: https://crates.io/crates/dictz
    defaults:
      run:
        working-directory: dictz-rs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish dry-run
        run: cargo publish --dry-run --allow-dirty
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::warning::CARGO_REGISTRY_TOKEN secret not set — skipping crates.io publish. See docs/PACKAGING.md."
            exit 0
          fi
          cargo publish --allow-dirty

  # =====================================================================
  # 5) Collect every artifact and publish the GitHub Release
  # =====================================================================
  github-release:
    name: Publish GitHub Release
    needs: [build-python-binaries, build-python-dist, build-rust]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -type f \
            \( -name "*.tar.gz" -o -name "*.zip" -o -name "*.AppImage" \
               -o -name "*.whl" -o -name "*.tar.gz" \) \
            -exec cp -v {} release/ \;
          ls -lh release/
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
          body: |
            ## Install

            - **PyPI**: `pip install dictz==${{ github.ref_name }}` (strip the `v`)
            - **crates.io** (Rust): `cargo add dictz@${{ github.ref_name }}` (strip the `v`)
            - **Portable binaries**: pick the matching archive below and unpack

            See [CHANGELOG.md](https://github.com/bayramkotan/dictz/blob/main/CHANGELOG.md) for details.
