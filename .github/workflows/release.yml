name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # needed to create GitHub Releases + upload assets

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact: dictz-linux-x86_64
          - os: windows-latest
            artifact: dictz-windows-x86_64
          - os: macos-13           # Intel macOS
            artifact: dictz-macos-x86_64
          - os: macos-14           # Apple Silicon
            artifact: dictz-macos-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install project + PyInstaller
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pyinstaller

      - name: Install Linux Qt system libs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 \
            libxcb-cursor0 libdbus-1-3 libnss3 libxcomposite1 libxdamage1 \
            libxrandr2 libasound2 libxtst6 libgl1

      - name: Run PyInstaller
        shell: bash
        run: pyinstaller packaging/pyinstaller/dictz.spec --noconfirm --clean

      - name: Package Linux tarball
        if: runner.os == 'Linux'
        run: |
          cd dist
          tar czf ../${{ matrix.artifact }}.tar.gz dictz/

      - name: Build AppImage
        if: runner.os == 'Linux'
        run: |
          bash packaging/appimage/build_appimage.sh
          mv dist/dictz-*-${{ matrix.artifact == 'dictz-linux-x86_64' && 'x86_64' || 'x86_64' }}.AppImage dictz-linux-x86_64.AppImage || true
          ls -la *.AppImage dist/*.AppImage 2>/dev/null || true

      - name: Package Windows zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist/dictz -DestinationPath ${{ matrix.artifact }}.zip -Force

      - name: Package macOS zip
        if: runner.os == 'macOS'
        run: |
          cd dist
          zip -qr ../${{ matrix.artifact }}.zip dictz.app/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.zip
            *.AppImage
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifact tree
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" -o -name "*.AppImage" \) -exec cp -v {} release/ \;
          ls -lh release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
